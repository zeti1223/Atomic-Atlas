<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <title>Atomic Atlas</title>
        <meta name="description" content="A modern interactive periodic table.">
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Gochi+Hand&family=Patrick+Hand&display=swap" rel="stylesheet">
        <link rel="stylesheet" href="style.css">
    </head>

    <body>
        <header>
            <h1>Atomic <span>Atlas</span></h1>
            <p>Click any element to reveal its info.</p>
        </header>
        <main class="wrap">
            <div class="table" id="table"></div>
        </main>
        <p class="swipe">Swipe the table sideways to see all the 18 groups</p>

        <div class="legend" id="legend"></div>

        <footer><a href="https://youtu.be/rz4Dd1I_fX0?si=hCMqYaIkkuACjShF" target="_blank" rel="noopener">Click here to learn periodic table in a fun way.</a></footer>
        
        <dialog id="dlg" aria-labelledby="mName">
            <div class="card">
                <button class="x" id="close" aria-label="Close">✕</button>
                <div class="mhead">
                    <div class="title"><span id="mNum"></span><b id="mSym"></b></div>
                    <div>
                        <h2 id="mName"></h2>
                        <span class="chip" id="mCat"></span>
                    </div>
                </div>
                <div class="stats">
                    <div><small>Atomic mass</small><b id="sMass"></b></div>
                    <div><small>Period</small><b id="sPeriod"></b></div>
                    <div><small>Group</small><b id="sGroup"></b></div>
                    <div><small>Block</small><b id="sBlock"></b></div>
                </div>
                <div class="factbox">
                    <small>Did you know?</small>
                    <p id="mFact"></p>
                </div>
            </div>
        </dialog>
        <script src="script.js"></script>
    </body>
</html>
